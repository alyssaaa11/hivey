<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hivey fleet</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='9' fill='%239befc8'/><path d='M10 9h7v9h6V9h7v23h-7V22h-6v10h-7z' fill='%23122319'/></svg>">
<style>
:root{
  --bg:#0d1119;--panel:#151b27;--panel2:#1b2332;--line:#273246;--text:#e8edf5;--muted:#8d9ab0;
  --honey:#f5b83d;--work:#38bdf8;--block:#fb7185;--done:#4ade80;--idle:#94a3b8;
  --r:14px;--font:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 var(--font)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--honey)}
/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;
  padding:10px 18px;background:rgba(13,17,25,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:6px}
.brand .logo{width:30px;height:30px;display:block;filter:drop-shadow(0 0 8px rgba(155,239,200,.35))}
.brand h1{margin:0;font-size:17px;letter-spacing:.2px}
.brand .sub{color:var(--muted);font-size:12px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);font-size:13px;user-select:none;transition:.15s}
.pill b{font-variant-numeric:tabular-nums}
.pill:hover{border-color:#3b4a64}
.pill.on{background:var(--panel2);border-color:var(--honey);box-shadow:0 0 0 1px var(--honey) inset}
.filtered{color:var(--honey);font-weight:600}
.filtered button{margin-left:4px;padding:1px 8px;border-radius:999px;border:1px solid var(--honey);background:transparent;color:var(--honey);cursor:pointer;font:inherit}
.pill.blocked b{color:var(--block)}.pill.working b{color:var(--work)}.pill.done b{color:var(--done)}.pill.idle b{color:var(--idle)}
.pill.compact b,.pill.clear b{color:var(--honey)}
.spacer{flex:1}
.search{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 11px;color:var(--text);width:210px;outline:none}
.search:focus{border-color:var(--honey)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--panel);border:0;padding:7px 12px;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 -2px 0 var(--honey)}
.iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 11px}
.iconbtn:hover{border-color:var(--honey)}
.every{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 9px;color:inherit;font:inherit;cursor:pointer}
.every:hover{border-color:var(--honey)}
.settings{position:fixed;top:58px;right:14px;z-index:70;width:290px;background:rgba(12,18,34,.97);border:1px solid rgba(120,170,255,.4);border-radius:14px;
  padding:12px 14px;box-shadow:0 14px 40px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:10px}
.settings[hidden]{display:none}
.settings .t{font-weight:700;font-size:13px;color:#cfe0ff;letter-spacing:.04em}
.settings label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.settings label span{color:#cbd5e1;white-space:nowrap}
.settings select{width:160px}
.settings .note{font-size:11px;color:var(--muted);line-height:1.4}
#gear.on{border-color:var(--honey)}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- views ---------- */
main{position:relative}
#fleet{position:relative;height:calc(100vh - 118px);min-height:420px;overflow:hidden;
  background:radial-gradient(1200px 600px at 50% 20%,#18202e,#0b0e15)}
#fleet canvas{display:block;cursor:grab}
#fleet canvas.drag{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:4px;will-change:transform}
.bubble{max-width:230px;padding:7px 10px;border-radius:12px;background:#f8fafc;color:#0f172a;font-size:12px;line-height:1.3;
  box-shadow:0 6px 18px rgba(0,0,0,.35);position:relative;text-align:left}
.bubble:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#f8fafc}
.tag.blocked .bubble{background:#fff1f2;outline:2px solid var(--block)}
.tag.blocked .bubble:after{border-top-color:#fff1f2}
.tag.working .bubble{outline:2px solid rgba(56,189,248,.7)}
.plate{display:flex;align-items:center;gap:6px;padding:2px 8px;border-radius:8px;background:rgba(15,20,30,.82);
  border:1px solid var(--line);font-size:11.5px;white-space:nowrap}
.plate .dot{width:8px;height:8px;border-radius:50%}
.lod-tiny .plate{font-size:10px;padding:1px 6px}
.tag.sel .plate{border-color:var(--honey);box-shadow:0 0 0 1px var(--honey)}
.room-label{position:absolute;transform:translate(0,-50%);font-weight:700;font-size:13px;color:#cbd5e1;
  text-shadow:0 1px 6px #000;white-space:nowrap;letter-spacing:.2px}
.lod-tiny .room-label{font-size:11px}
.ship-label{position:absolute;left:0;top:0;border-radius:8px;border:1px solid transparent;pointer-events:auto;transition:background .15s,border-color .15s}
.ship-label .cap{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;white-space:nowrap;font-size:11px;color:#cfe0ff;
  background:rgba(10,16,32,.8);border:1px solid rgba(120,170,255,.35);border-radius:999px;padding:2px 9px;opacity:0;transition:opacity .15s;pointer-events:none}
.ship-label:hover,.ship-label.dragging{background:rgba(255,200,80,.10);border-color:rgba(255,200,80,.55)}
.ship-label:hover .cap,.ship-label.dragging .cap{opacity:1}
.ship-menu{position:fixed;z-index:60;min-width:210px;background:rgba(12,18,34,.96);border:1px solid rgba(120,170,255,.45);border-radius:12px;padding:8px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:6px}
.ship-menu .t{font-weight:700;padding:2px 4px 4px;text-transform:uppercase;letter-spacing:.05em;font-size:12px;color:#cfe0ff}
.ship-menu button{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:inherit;cursor:pointer}
.ship-menu button:hover{border-color:var(--honey)}
.ship-menu button.danger{color:#fda4af}.ship-menu button.danger.arm{background:#7f1d1d;color:#fff;border-color:#fb7185}
#drawer .wiki a{color:inherit;text-decoration:none}
#drawer .wiki-head a{font-weight:600;color:#9befc8}
#drawer .wiki-head a:hover,#drawer .wiki-page:hover .wt{text-decoration:underline}
#drawer .wiki-sub{margin:8px 0 3px;text-transform:uppercase;font-size:10px;letter-spacing:.06em}
#drawer .wiki-page{display:flex;flex-direction:column;padding:4px 6px;margin:0 -6px;border-radius:7px}
#drawer .wiki-page:hover{background:var(--panel2)}
#drawer .wiki-page .meta{font-size:11px}
#drawer .wiki-log{font-size:12px;line-height:1.35;margin:2px 0}
.ship-menu .note{font-size:11px;color:#93a4c3;padding:0 4px}
.ship-label{cursor:grab;touch-action:none;user-select:none}.ship-label.dragging{cursor:grabbing;border-color:var(--honey)}
#hud{position:absolute;left:14px;bottom:12px;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}
#hud button{background:rgba(21,27,39,.9);border:1px solid var(--line);border-radius:9px;padding:5px 9px}
#tip{position:fixed;z-index:30;pointer-events:none;max-width:340px;padding:11px 13px;border-radius:12px;background:rgba(21,27,39,.97);
  border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.45);display:none;font-size:12.5px}
#tip h4{margin:0 0 4px;font-size:14px}
#tip .hint{margin-top:7px;color:var(--muted);font-size:11.5px}
/* ---------- board ---------- */
#board{padding:16px 18px 40px;display:none}
.section{margin:6px 0 18px}
.section h2{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{position:relative;padding:13px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);
  cursor:pointer;transition:transform .12s,border-color .12s;content-visibility:auto;contain-intrinsic-size:260px}
.card:hover{transform:translateY(-2px);border-color:#3b4a64}
.card.blocked{border-color:rgba(251,113,133,.55);box-shadow:0 0 0 1px rgba(251,113,133,.25)}
.card.working{border-color:rgba(56,189,248,.4)}
.card .top{display:flex;gap:10px;align-items:center}
.avatar{position:relative;flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:23px;
  background:radial-gradient(circle at 35% 30%,var(--hue1),var(--hue2))}
.avatar .st{position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;border:2px solid var(--panel)}
.card.working .avatar{animation:bob .9s ease-in-out infinite}
.card.working .avatar:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--work);
  border-right-color:transparent;border-bottom-color:transparent;animation:spin 1.1s linear infinite}
.card.blocked .avatar{animation:wave 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-12deg)}85%{transform:rotate(10deg)}}
.name{font-weight:650;font-size:14.5px}
.meta{color:var(--muted);font-size:11.5px}
.card .say{margin:11px 0 8px;padding:9px 11px;border-radius:11px;background:#eef2f8;color:#141a26;font-size:13px;font-weight:500}
/* working: a soft green glow drifts across the card; needs you: amber */
.card.working,.card.blocked,.card.asks{background-size:300% 300%;animation:drift 6s ease-in-out infinite}
.card.working{background-image:linear-gradient(120deg,var(--panel) 20%,rgba(74,222,128,.16) 50%,var(--panel) 80%);border-color:rgba(74,222,128,.5)}
.card.blocked,.card.asks{background-image:linear-gradient(120deg,var(--panel) 20%,rgba(250,204,21,.2) 50%,var(--panel) 80%);border-color:rgba(250,204,21,.6);box-shadow:0 0 0 1px rgba(250,204,21,.25)}
.card.blocked{animation-duration:3s}
.card.working .say{background:#e7f8ec}
.card.blocked .say,.card.asks .say{background:#fdf6dc}
@keyframes drift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@media (prefers-reduced-motion:reduce){.card.working,.card.blocked,.card.asks{animation:none;background-position:50% 50%}}
.jobrow{display:flex;align-items:center;gap:7px;margin:7px 0;font-size:12px}
.jobrow .jn{white-space:nowrap;max-width:40%;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.jobrow .bar{flex:1;height:6px;border-radius:9px;background:#0e131c;overflow:hidden}
.jobrow .bar i{display:block;height:100%;border-radius:9px;background:var(--done);transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.jobrow .jc{color:var(--muted);white-space:nowrap}
.jobrow.fin .jn:after{content:" ✓";color:var(--done)}
.jobrow .jlink{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:11.5px;color:var(--text);cursor:pointer;white-space:nowrap}
.jobrow .jlink:hover{border-color:var(--done)}
.card .job{font-size:12.5px;margin:6px 0}
.card ul{margin:4px 0 6px;padding:0;list-style:none;font-size:12px;color:#c7d0de}
.card li:before{content:"✓ ";color:var(--done)}
.card .next{font-size:12px;color:var(--muted)}
.card .need{font-size:12.5px;margin:7px 0;padding:7px 9px;border-radius:9px;background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.35)}
.ctx{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:11.5px;color:var(--muted)}
.ctx .bar{flex:1;height:6px;border-radius:9px;background:#0e131c;overflow:hidden}
.ctx .bar i{display:block;height:100%;border-radius:9px}
.badge{display:inline-flex;gap:4px;align-items:center;padding:1px 7px;border-radius:999px;font-size:11px;border:1px solid var(--line)}
.badge.compact,.badge.clear{border-color:rgba(245,184,61,.55);color:var(--honey)}
.badge.md{border-color:rgba(251,113,133,.55);color:#fb7185}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.actions button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12px}
.actions button:hover{border-color:var(--honey)}
.actions button.arm{border-color:var(--block);color:var(--block)}
.actions button.primary{border-color:rgba(245,184,61,.6)}
.actions button:disabled{opacity:.35;cursor:not-allowed}
/* ---------- list ---------- */
#jobs{display:none;background:#fff}
#jobs iframe{display:block;width:100%;height:calc(100vh - 70px);border:0}
body.v-jobs .search{visibility:hidden}
/* failing scheduled jobs, live from /hv-job-health: a banner over the jobs pages and a count on the tab */
#jobhealth{background:var(--bg);color:var(--text);padding:10px 18px;border-bottom:1px solid var(--line);max-height:46vh;overflow:auto}
#jobhealth:empty{display:none}
#jobhealth.ok{padding:6px 18px;color:var(--muted);font-size:12.5px}
#jobhealth h4{margin:0 0 6px;font-size:14px;color:var(--block)}
#jobhealth h4.soft{color:var(--honey);margin-top:10px}
#jobhealth details{border:1px solid rgba(251,113,133,.35);background:rgba(251,113,133,.07);border-radius:10px;margin:5px 0;font-size:12.5px}
#jobhealth details.soft{border-color:rgba(245,184,61,.3);background:rgba(245,184,61,.05)}
#jobhealth summary{cursor:pointer;padding:6px 10px;list-style:none;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
#jobhealth summary::-webkit-details-marker{display:none}
#jobhealth summary b{white-space:nowrap}
#jobhealth summary .m{color:var(--muted);white-space:nowrap}
#jobhealth summary .e{color:#fecdd3;word-break:break-word}
#jobhealth details.soft summary .e{color:#fde68a}
#jobhealth .body{padding:0 10px 9px}
#jobhealth ul{margin:4px 0;padding-left:18px;color:#fecdd3}
#jobhealth pre{background:#0a0e15;border:1px solid var(--line);border-radius:8px;padding:8px;font:11px/1.35 ui-monospace,Menlo,monospace;
  white-space:pre-wrap;max-height:220px;overflow:auto;color:#c9d4e3;margin:6px 0 0}
#views .jbad{margin-left:5px;padding:0 6px;border-radius:999px;background:var(--block);color:#1b0b10;font-size:11px;font-weight:700}
#views .jbad.soft{background:var(--honey)}
#list{display:none;padding:12px 18px 40px}
/* ---------- dashboards: the list on the left, the one you pick in a frame on the right ---------- */
#dash{display:none;height:calc(100vh - 58px)}
#dash.on{display:flex}
body.v-dash .search{visibility:hidden}
/* the list folds away (☰ brings it back) and ⛶ gives the dashboard the whole window */
#dash.fold .dside{display:none}
#dash.max{position:fixed;inset:0;z-index:45;height:100vh!important}
#dash.max .dside{display:none}
#dash .dbar .ic{padding:4px 8px;font-size:13px;line-height:1}
#dash .dside{flex:none;width:290px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
#dash .dside .hd{display:flex;align-items:center;gap:8px;padding:12px 12px 8px}
#dash .dside .hd h2{margin:0;font-size:15px;flex:1}
#dash .add{background:var(--honey);color:#1b1405;border:0;border-radius:9px;padding:6px 11px;font-weight:650;font-size:12.5px}
#dash .dlist{flex:1;overflow-y:auto;padding:4px 8px 10px;display:flex;flex-direction:column;gap:4px}
#dash .addf{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:5px 9px;font-weight:600;font-size:12px}
#dash .addf:hover{border-color:var(--honey)}
#dash .dfind{padding:0 10px 6px}
#dash .dfind[hidden]{display:none}
#dash .dfind input{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 9px;color:var(--text);font:inherit;font-size:12.5px;outline:none}
#dash .dfind input:focus{border-color:var(--honey)}
.dgroup{display:flex;flex-direction:column;gap:4px;border-radius:10px;border:1px dashed transparent}
.dgroup.drop{border-color:var(--honey);background:color-mix(in srgb,var(--honey) 8%,transparent)}
.dlist.dragging .dgroup:not(.new){border-color:var(--line)}
.dlist.dragging .dgroup.drop{border-color:var(--honey)}
.dfh{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:9px;cursor:pointer;font-weight:650;font-size:13px;user-select:none}
.dfh:hover{background:var(--panel2)}
.dfh .car{width:10px;color:var(--muted);font-size:11px}
.dfh .fn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dfh .n{color:var(--muted);font-weight:500;font-size:11.5px;background:var(--panel2);border-radius:8px;padding:0 6px}
.dfh .acts{display:none;gap:2px}
.dfh:hover .acts,.dfh .acts:has(.arm){display:flex}
.dfh .acts button{background:none;border:1px solid transparent;border-radius:6px;padding:1px 5px;font-size:12px;color:var(--muted);cursor:pointer}
.dfh .acts button:hover{border-color:var(--line);color:var(--text)}
.dfh .acts button.arm{border-color:var(--block);color:var(--block)}
.dfh.nf{cursor:default;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding-top:10px}
.dfh.nf:hover{background:none}
.dfh input.fname{flex:1;min-width:0;background:var(--bg);border:1px solid var(--honey);border-radius:7px;padding:4px 7px;color:var(--text);font:inherit;outline:none}
.dfb{display:flex;flex-direction:column;gap:4px;padding-left:12px}
.dgroup.loose .dfb{padding-left:0}
.dempty{color:var(--muted);font-size:11.5px;padding:6px 9px;font-style:italic}
#dash .dbar select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:12px;color:var(--text);max-width:150px}
#dash .dfoot{padding:9px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px;line-height:1.4}
#dash code{background:var(--panel2);padding:1px 5px;border-radius:5px;font-size:11px;word-break:break-all}
.ditem{display:flex;gap:9px;align-items:center;padding:8px 9px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.ditem:hover{background:var(--panel2)}
.ditem.sel{background:var(--panel2);border-color:var(--honey)}
.ditem .fav{flex:none;width:28px;height:28px;border-radius:7px;background:var(--bg);display:grid;place-items:center;overflow:hidden;font-size:15px}
.ditem .fav img{width:18px;height:18px}
.ditem .tx{min-width:0;flex:1}
.ditem .nm{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ditem .host{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ditem .dot{width:8px;height:8px;border-radius:50%;background:var(--idle);flex:none}
.ditem .dot.up{background:var(--done)}.ditem .dot.down{background:var(--block)}.ditem .dot.warn{background:var(--honey)}
#dash .dmain{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
#dash .dbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);min-height:44px}
#dash .dbar .t{font-weight:650}
#dash .dbar .m{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#dash .dbar button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px}
#dash .dbar button:hover{border-color:var(--honey)}
#dash .dbar button.arm{border-color:var(--block);color:var(--block)}
#dash .dview{flex:1;position:relative}
#dash iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#dash .dmsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px;background:var(--bg)}
#dash .dmsg[hidden]{display:none!important}
#dash .dmsg b{color:var(--text)}
#dash .dmsg button{margin-top:10px;background:var(--honey);color:#1b1405;border:0;border-radius:9px;padding:7px 14px;font-weight:650}
.dform{display:grid;grid-template-columns:110px 1fr;gap:9px 12px;align-items:center;padding:18px;margin:18px;border-radius:var(--r);
  background:var(--panel);border:1px solid var(--honey);max-width:660px}
.dform h3{grid-column:1/-1;margin:0 0 4px;font-size:15px}
.dform input[type=text],.dform input[type=url],.dform input[type=password]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--text);font:inherit;outline:none}
.dform input:focus{border-color:var(--honey)}
.dform label{color:var(--muted);font-size:12.5px}
.dform .chk{grid-column:2;display:flex;gap:7px;align-items:center;color:var(--muted);font-size:12.5px}
.dform .hint{grid-column:2;color:var(--muted);font-size:11.5px;line-height:1.45;margin-top:-4px}
.dform .btns{grid-column:2;display:flex;gap:8px;margin-top:4px}
.dform .btns button{border-radius:8px;padding:6px 14px;border:1px solid var(--line);background:var(--panel2)}
.dform .btns button.primary{background:var(--honey);color:#1b1405;border:0;font-weight:650}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--muted);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;position:sticky;top:57px;background:var(--bg)}
td{padding:6px 8px;border-bottom:1px solid #1a2130;vertical-align:top}
tr:hover td{background:var(--panel)}
tr{cursor:pointer}
td.j{max-width:420px}
/* ---------- drawer ---------- */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);z-index:40;background:var(--panel);border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .22s ease;overflow-y:auto;padding:18px 20px 30px;box-shadow:-20px 0 40px rgba(0,0,0,.4)}
#drawer.open{transform:none}
#drawer .x{position:absolute;top:12px;right:14px;background:none;border:0;font-size:20px;color:var(--muted)}
#drawer h3{margin:0;font-size:19px}
#drawer dl{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:12.5px;margin:14px 0}
#drawer dt{color:var(--muted)}
#drawer dd{margin:0;word-break:break-word}
#drawer pre{background:#0a0e15;border:1px solid var(--line);border-radius:10px;padding:10px;font:11px/1.35 ui-monospace,Menlo,monospace;
  white-space:pre-wrap;max-height:340px;overflow:auto;color:#c9d4e3}
.gauge{display:flex;align-items:center;gap:14px;margin:12px 0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);opacity:0;transition:.2s;z-index:50;
  padding:9px 15px;border-radius:11px;background:#111827;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%)}
.empty{padding:60px;text-align:center;color:var(--muted)}
.err{color:var(--block);font-size:12px}
.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%,30%,60%{box-shadow:0 0 0 2px #ffd36a,0 0 28px 6px rgba(127,232,255,.75);background-color:rgba(127,232,255,.12)}15%,45%,75%{box-shadow:0 0 0 1px #7fe8ff,0 0 10px 2px rgba(255,211,106,.4)}100%{box-shadow:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* approve / deny / change, chat and voice on the agent in the middle */
.holo .decide{display:flex;gap:6px;justify-content:center;margin:10px 0 2px}
.holo .decide button{flex:1;padding:7px 8px;border-radius:10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:#0b1020;border:0;transition:transform .12s,filter .12s}
.holo .decide button:hover{transform:translateY(-1px);filter:brightness(1.1)}
.holo .decide button:disabled{opacity:.7;cursor:default;transform:none}
.holo .decide [data-say=approve]{background:#4ade80;box-shadow:0 0 16px rgba(74,222,128,.55)}
.holo .decide [data-say=deny]{background:#fb7185;box-shadow:0 0 16px rgba(251,113,133,.5)}
.holo .decide [data-say=change]{background:#e2e8f0}
.holo .talk{display:flex;gap:6px;justify-content:center;margin-top:8px}
.holo .talk button{background:rgba(var(--c)/.12);border:1px solid rgba(var(--c)/.5);color:var(--text);border-radius:8px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.holo .talk button:hover{background:rgba(var(--c)/.25)}
.rtabs .vt{margin-left:10px}
.rtabs .vt.on{border-color:#38bdf8;box-shadow:0 0 12px rgba(56,189,248,.3)}
#room.chatting .rig{--ty:-118px;--sc:.86}
#room.chatting .scene{min-height:calc(100vh - 230px + 40px)}
#chatdock .cyes,#chatdock .cno{font-weight:700;color:#05070d!important;border:0!important}
#chatdock .cyes{background:#4ade80!important}#chatdock .cno{background:#fb7185!important}
#chatdock{position:fixed;left:50%;bottom:14px;z-index:60;width:min(860px,calc(100vw - 32px));transform:translateX(-50%);perspective:900px;--c:56 189 248}
#chatdock.working{--c:74 222 128}#chatdock.needs{--c:250 204 21}#chatdock.done{--c:56 189 248}#chatdock.idle{--c:148 163 184}
#chatdock .console{transform:rotateX(7deg);transform-origin:50% 100%;border-radius:16px;overflow:hidden;
  background:linear-gradient(#060a12,#03060c);border:1.5px solid rgba(var(--c)/.8);
  box-shadow:0 0 40px rgba(var(--c)/.4),0 20px 60px rgba(0,0,0,.7),inset 0 0 30px rgba(var(--c)/.08);animation:dockin .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes dockin{from{opacity:0;transform:rotateX(40deg) translateY(60px)}}
#chatdock .chead{display:flex;align-items:center;gap:8px;padding:7px 10px;background:rgba(var(--c)/.12);border-bottom:1px solid rgba(var(--c)/.35);font-size:12.5px}
#chatdock .dots{display:flex;gap:5px}#chatdock .dots i{width:10px;height:10px;border-radius:50%;background:#fb7185}#chatdock .dots i:nth-child(2){background:#f5b83d}#chatdock .dots i:nth-child(3){background:#4ade80}
#chatdock .cst{color:rgb(var(--c));margin-right:auto}
#chatdock .chead button{background:none;border:1px solid rgba(var(--c)/.4);color:var(--text);border-radius:6px;padding:1px 8px;cursor:pointer;font:inherit}
#chatdock .term{margin:0;height:min(200px,26vh);overflow:auto;padding:10px 12px;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:#cfe8d6;white-space:pre-wrap;
  background:repeating-linear-gradient(0deg,rgba(var(--c)/.04) 0 1px,transparent 1px 3px);text-shadow:0 0 4px rgba(var(--c)/.35)}
#chatdock .cin{display:flex;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid rgba(var(--c)/.35);background:rgba(255,255,255,.03)}
#chatdock .pr{color:rgb(var(--c));font-weight:700}
#chatdock input{flex:1;background:transparent;border:0;outline:0;color:var(--text);font:13px ui-monospace,Menlo,monospace}
#chatdock .cin button{background:rgb(var(--c));color:#05070d;border:0;border-radius:8px;padding:5px 14px;font:inherit;font-weight:700;cursor:pointer}
@media (prefers-reduced-motion:reduce){#chatdock .console{animation:none}}
@media (max-width:820px){#chatdock .console{transform:none}#room.chatting .rig{--ty:0px;--sc:1}#room.chatting{padding-bottom:330px}}
/* ---------- 3D command room ---------- */
#room{display:none;padding:10px 16px 18px}
.rtabs{display:flex;gap:6px;justify-content:center;margin:2px 0 10px;flex-wrap:wrap}
/* the legend: what each tab or pill means, shown on hover (or keyboard focus) */
[data-tip]{position:relative}
[data-tip]:hover:after,[data-tip]:focus-visible:after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);z-index:50;
  width:max-content;max-width:260px;white-space:normal;text-align:left;padding:8px 11px;border-radius:10px;font-size:12px;font-weight:400;line-height:1.4;
  color:var(--text);background:#0b1222;border:1px solid #2a3858;box-shadow:0 8px 24px rgba(0,0,0,.55);pointer-events:none}

.rtabs button{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 14px;font:inherit;font-size:13px;cursor:pointer}
.rtabs button b{color:var(--text);margin-left:3px}
.rtabs button.on{color:var(--text);border-color:#4ade80;box-shadow:0 0 14px rgba(74,222,128,.35),inset 0 0 10px rgba(74,222,128,.15)}
.scene{--tile:118px;--rx:0deg;--ry:0deg;--rz:0px;cursor:grab;touch-action:pan-y;user-select:none;position:relative;min-height:calc(100vh - 230px);border-radius:22px;overflow:hidden;
  perspective:1000px;perspective-origin:50% 42%;border:1px solid #1d2740;
  background:radial-gradient(ellipse 45% 40% at 50% 46%,rgba(56,189,248,.18),transparent 70%),
    radial-gradient(ellipse 90% 55% at 50% 108%,rgba(139,92,246,.32),transparent 70%),linear-gradient(#05070d,#0a0f1e 50%,#080b16);
  box-shadow:inset 0 0 120px rgba(0,0,0,.8),inset 0 0 60px rgba(56,189,248,.06)}
/* a themed room: a view behind everything that shifts a little as you look around, frosted walls in its accent colour */
.backdrop{position:absolute;inset:-8%;background:#05070d center/cover no-repeat;pointer-events:none;
  transform:translate(calc(var(--ryn,0) * -5px),calc(var(--rxn,0) * 4px)) scale(calc(1.06 + var(--rzn,0) / 4000));transition:transform .25s ease-out,opacity .6s;animation:bgin .8s ease-out}
.backdrop:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 40%,transparent 40%,rgba(3,5,10,.65)),linear-gradient(transparent 45%,rgba(3,5,10,.75))}
@keyframes bgin{from{opacity:0}}
.scene.themed{background:#05070d}
.scene.themed .ceiling{opacity:.18}.scene.themed .backwall{opacity:0}.scene.themed .floor{opacity:.45}
.scene.themed .wall{background:linear-gradient(180deg,rgba(var(--acc)/.10),rgba(6,9,18,.62));border-color:rgba(var(--acc)/.4);border-top-color:rgba(var(--acc)/.85);
  box-shadow:inset 0 0 40px rgba(var(--acc)/.10),0 0 30px rgba(var(--acc)/.18);-webkit-backdrop-filter:blur(7px) saturate(1.2);backdrop-filter:blur(7px) saturate(1.2)}
.scene.themed .beam{filter:hue-rotate(0deg) saturate(.8)}
.rtabs select.rtheme{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
/* the room shell: ceiling with light strips, back wall with pillars, floor grid */
.shell{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none;transform:translateZ(calc(var(--rz) * .5)) rotateX(calc(var(--rx) * .8)) rotateY(calc(var(--ry) * .8));transition:transform .25s ease-out}
.ceiling{position:absolute;left:-40%;right:-40%;top:0;height:44%;transform:rotateX(-76deg);transform-origin:50% 0;
  background:repeating-linear-gradient(90deg,transparent 0 140px,rgba(56,189,248,.5) 140px 144px,transparent 144px 150px),
    linear-gradient(rgba(56,189,248,.12) 1px,transparent 1px) 0 0/80px 80px;
  -webkit-mask:linear-gradient(#000,transparent 85%);mask:linear-gradient(#000,transparent 85%);filter:drop-shadow(0 0 6px rgba(56,189,248,.8))}
.backwall{position:absolute;left:12%;right:12%;top:20%;height:44%;transform:translateZ(-380px);
  background:linear-gradient(90deg,transparent,rgba(56,189,248,.08) 20%,rgba(56,189,248,.08) 80%,transparent),
    repeating-linear-gradient(90deg,transparent 0 12.5%,rgba(56,189,248,.18) 12.5% calc(12.5% + 2px));
  border-top:2px solid rgba(56,189,248,.45);border-bottom:2px solid rgba(139,92,246,.5);box-shadow:0 -10px 40px rgba(56,189,248,.25),0 10px 50px rgba(139,92,246,.3)}
.floor{position:absolute;left:-40%;right:-40%;bottom:0;height:50%;transform:rotateX(78deg);transform-origin:50% 100%;
  background:radial-gradient(ellipse 30% 40% at 50% 30%,rgba(var(--fc,56 189 248)/.35),transparent 70%),
    linear-gradient(rgba(56,189,248,.25) 1px,transparent 1px) 0 0/60px 60px,linear-gradient(90deg,rgba(56,189,248,.25) 1px,transparent 1px) 0 0/60px 60px;
  -webkit-mask:linear-gradient(transparent,#000 55%);mask:linear-gradient(transparent,#000 55%);animation:floorrun 6s linear infinite}
@keyframes floorrun{to{background-position:0 0,0 60px,0 0}}
/* the things you touch, tilted with the mouse */
.rig{position:relative;z-index:1;display:grid;grid-template-columns:1fr minmax(300px,380px) 1fr;gap:14px;align-items:center;
  min-height:calc(100vh - 232px);padding:26px 18px 46px;transform-style:preserve-3d;
  transform:translateY(var(--ty,0px)) scale(var(--sc,1)) translateZ(var(--rz)) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .25s ease-out;--c:56 189 248}
.wall{position:relative;display:grid;grid-template-columns:repeat(auto-fill,var(--tile));grid-auto-rows:calc((var(--tile) - 12px) / 2);grid-auto-flow:row dense;gap:12px;align-content:center;
  max-height:calc(100vh - 300px);overflow:auto;padding:18px;border-radius:26px;scrollbar-width:thin;
  background:linear-gradient(180deg,rgba(56,189,248,.07),rgba(10,14,26,.5));border:1px solid rgba(56,189,248,.28);border-top:3px solid rgba(56,189,248,.75);
  box-shadow:inset 0 0 40px rgba(56,189,248,.08),0 0 30px rgba(56,189,248,.12);
  -webkit-box-reflect:below 10px linear-gradient(transparent 78%,rgba(255,255,255,.12))}
.wall.left{transform:rotateY(26deg) translateZ(-30px);transform-origin:100% 50%;direction:rtl}
.wall.right{transform:rotateY(-26deg) translateZ(-30px);transform-origin:0 50%}
.tile{position:relative;overflow:hidden;direction:ltr;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:8px 6px;border-radius:16px;cursor:pointer;
  --c:148 163 184;color:var(--text);font:inherit;text-align:center;
  background:linear-gradient(160deg,rgba(var(--c)/.26),rgba(8,12,22,.9) 68%);border:1.5px solid rgba(var(--c)/.8);
  box-shadow:0 0 16px rgba(var(--c)/.35),inset 0 0 18px rgba(var(--c)/.18),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .2s,box-shadow .2s}
.tile:before{content:"";position:absolute;inset:0 0 55% 0;background:linear-gradient(rgba(255,255,255,.14),transparent);pointer-events:none}
.tile:after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);pointer-events:none}
.tile:hover:after{animation:sheen .8s ease-out}
@keyframes sheen{to{left:130%}}
.tile:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 8px 26px rgba(var(--c)/.6),inset 0 0 18px rgba(var(--c)/.25),inset 0 1px 0 rgba(255,255,255,.35)}
.tile.picked{transform:scale(1.06);box-shadow:0 0 0 2px rgb(var(--c)),0 0 34px rgba(var(--c)/.85)}
.tile .ic{font-size:30px;line-height:1;filter:drop-shadow(0 0 8px rgba(var(--c)/.85))}
.tile .nm{font-size:12.5px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 0 8px rgba(var(--c)/.5)}
.tile .sl,.stage .sl{display:flex;align-items:center;gap:5px;font-size:11px;color:rgb(var(--c))}
.tile .sl i,.stage .sl i{width:7px;height:7px;border-radius:50%;background:rgb(var(--c));box-shadow:0 0 8px rgb(var(--c))}
.working{--c:74 222 128}.needs{--c:250 204 21}.done{--c:56 189 248}.idle{--c:148 163 184}.closed{--c:139 92 246}
.tile.closed{opacity:.75;filter:saturate(.7)}
/* one agent's sessions, stacked and joined (walls use half-height rows: a tile spans 2, each extra session 1) */
.wall>.tile{grid-row:span 2}
/* Auto Mode on the agent in the middle, and its 🤖 badge on the tile */
.stage .autob{display:block;margin:8px auto 2px;padding:6px 14px;border-radius:999px;border:1px solid rgba(167,139,250,.6);background:rgba(167,139,250,.12);color:var(--text);font:inherit;font-size:12.5px;cursor:pointer}
.stage .autob:hover{background:rgba(167,139,250,.25);box-shadow:0 0 14px rgba(167,139,250,.4)}
.stage .auto{margin:8px 0 2px;padding:9px 11px;border-radius:12px;border:1px solid rgba(167,139,250,.55);background:rgba(167,139,250,.10);font-size:12.5px;text-align:left}
.stage .auto.on{box-shadow:0 0 18px rgba(167,139,250,.35)}
.stage .auto .ah{display:flex;align-items:center;gap:8px;font-weight:700}
.stage .auto .ah button{margin-left:auto}
.stage .auto .ag{margin-top:5px;color:var(--text)}.stage .auto .aw{margin-top:5px;color:var(--muted);font-size:11.5px}.stage .auto .aw span{opacity:.75}
.stage .auto .asheet{display:inline-block;margin-top:6px;color:#c4b5fd}
.stage .auto .hrs{display:flex;gap:6px;margin:7px 0}
.stage .auto button{padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:12px;cursor:pointer}
.stage .auto button.on,.stage .auto [data-auto-go]{border-color:#a78bfa;background:rgba(167,139,250,.3)}
.stage .auto button.arm{border-color:#fb7185;color:#fb7185}
.stage .auto textarea{width:100%;box-sizing:border-box;resize:vertical;border-radius:8px;border:1px solid var(--line);background:rgba(5,8,16,.7);color:var(--text);font:inherit;font-size:12px;padding:6px 8px}
.stage .auto .arow{display:flex;gap:6px;margin-top:6px}.stage .auto .anote{margin-top:6px;font-size:11px;color:var(--muted)}
.tile .autobadge{position:absolute;top:5px;left:6px;font-size:13px;filter:drop-shadow(0 0 6px rgba(167,139,250,.9));animation:autopulse 2.4s ease-in-out infinite}
@keyframes autopulse{50%{transform:scale(1.18)}}
/* pinning a card: every wall cell shows, the one under the pointer lights up */
.wall.pinning{padding-bottom:calc(var(--tile) + 30px)}
.wall .cells{position:absolute;top:18px;left:18px;right:18px;display:grid;grid-template-columns:repeat(auto-fill,var(--tile));grid-auto-rows:calc((var(--tile) - 12px) / 2);gap:12px;z-index:5}
.wall .cell{border:1.5px dashed rgba(56,189,248,.45);border-radius:16px;background:rgba(56,189,248,.05)}
.wall .cell.on{border:2px solid rgb(250 204 21);background:rgba(250,204,21,.18);box-shadow:0 0 22px rgba(250,204,21,.5)}
.tile.lifted,.cluster.lifted{opacity:.3}
[data-group]{touch-action:none}

.cluster{position:relative;direction:ltr;display:flex;flex-direction:column;gap:3px;min-height:0;
  border-radius:18px;padding:3px;background:rgba(var(--c)/.08);box-shadow:0 0 0 1px rgba(var(--c)/.35),0 0 18px rgba(var(--c)/.18)}
.cluster>.tile{flex:0 0 calc(var(--tile) - 6px);border-bottom-left-radius:6px;border-bottom-right-radius:6px}
.cluster .subs{flex:1;display:flex;flex-direction:column;gap:3px;min-height:0}
.cluster .tile.sub{flex:1 1 0;min-height:0;flex-direction:row;gap:6px;padding:4px 8px;border-radius:6px;justify-content:flex-start}
.cluster .subs .tile.sub:last-child{border-bottom-left-radius:14px;border-bottom-right-radius:14px}
.tile.sub .ic{font-size:16px}.tile.sub .nm{flex:1;text-align:left;font-size:11.5px}.tile.sub .sl{gap:0}
.tile.sub:hover{transform:translateX(2px) scale(1.02)}
.cluster .cnt{position:absolute;top:-7px;right:-7px;z-index:2;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:9px;
  background:rgb(var(--c));color:#0b1020;box-shadow:0 0 10px rgba(var(--c)/.8)}

.tile.working{animation:tglow 2.4s ease-in-out infinite}.tile.needs{animation:tglow 1.3s ease-in-out infinite}
@keyframes tglow{50%{box-shadow:0 0 30px rgba(var(--c)/.75),inset 0 0 24px rgba(var(--c)/.35),inset 0 1px 0 rgba(255,255,255,.3)}}
/* the middle: pedestal, light beam, rising particles, the picked agent as a hologram */
.center{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:460px;transform-style:preserve-3d;transform:translateZ(40px)}
.beam{position:absolute;left:50%;bottom:44px;width:300px;height:78%;transform:translateX(-50%);pointer-events:none;
  background:linear-gradient(0deg,rgba(var(--c)/.38),rgba(var(--c)/.08) 60%,transparent);clip-path:polygon(32% 100%,68% 100%,100% 0,0 0);filter:blur(2px);
  opacity:.55;animation:beam 3.5s ease-in-out infinite}
@keyframes beam{50%{opacity:.85}}
.parts{position:absolute;left:50%;bottom:50px;width:220px;height:75%;transform:translateX(-50%);pointer-events:none}
.parts i{position:absolute;bottom:0;width:3px;height:3px;border-radius:50%;background:rgb(var(--c));box-shadow:0 0 6px rgb(var(--c));opacity:0;animation:rise2 var(--d,4s) linear var(--w,0s) infinite}
@keyframes rise2{10%{opacity:.9}100%{transform:translateY(-330px);opacity:0}}
.stage{position:relative;z-index:2;width:100%}
.stage.empty{height:330px;display:flex;align-items:center;justify-content:center}
.stage.empty .hint{color:#7d8db0;font-size:13px;letter-spacing:.06em;padding:8px 16px;border:1px dashed #33425f;border-radius:999px;background:rgba(5,8,15,.6);animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55}}
.holo{position:relative;overflow:hidden;padding:20px 18px 16px;border-radius:26px;text-align:center;backdrop-filter:blur(6px);
  background:linear-gradient(170deg,rgba(var(--c)/.24),rgba(6,10,20,.86) 42%);border:2px solid rgba(var(--c)/.9);
  box-shadow:0 0 50px rgba(var(--c)/.5),inset 0 0 44px rgba(var(--c)/.2),inset 0 1px 0 rgba(255,255,255,.3);
  animation:float 5s ease-in-out infinite;-webkit-box-reflect:below 70px linear-gradient(transparent 82%,rgba(255,255,255,.1))}
.holo.fresh{animation:rise .5s cubic-bezier(.2,1.3,.4,1),float 5s ease-in-out .5s infinite}
.holo:before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:repeating-linear-gradient(0deg,rgba(var(--c)/.07) 0 1px,transparent 1px 4px);mix-blend-mode:screen}
.holo:after{content:"";position:absolute;top:-20%;bottom:-20%;width:35%;left:-50%;transform:skewX(-18deg);pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);animation:sweep 5.5s ease-in-out 1s infinite}
@keyframes sweep{0%,60%{left:-50%}100%{left:140%}}
.holo>*{position:relative;z-index:1}
@keyframes rise{from{opacity:0;transform:translateY(60px) scale(.85) rotateX(20deg);filter:blur(6px)}}
@keyframes float{50%{transform:translateY(-7px)}}
.bigav{position:relative;width:100px;height:100px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;font-size:54px;
  background:radial-gradient(circle at 35% 30%,var(--hue1),var(--hue2));box-shadow:0 0 0 3px rgba(var(--c)/.75),0 0 40px rgba(var(--c)/.75),inset 0 -8px 18px rgba(0,0,0,.35)}
.bigav[data-open]{cursor:pointer;transition:transform .2s,box-shadow .2s}
.bigav[data-open]:hover{transform:scale(1.07);box-shadow:0 0 0 3px rgb(var(--c)),0 0 60px rgba(var(--c)/.95),inset 0 -8px 18px rgba(0,0,0,.35)}
.bigav[data-open]:active{transform:scale(.97)}
.bigav:after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px dashed rgba(var(--c)/.55);animation:spin 12s linear infinite}
.holo .nm{font-size:21px;font-weight:800;text-shadow:0 0 14px rgba(var(--c)/.6)}
.holo .sl{justify-content:center;font-size:12.5px;margin:4px 0 10px}
.holo .say{padding:9px 11px;border-radius:12px;background:#eef2f8;color:#141a26;font-size:13px;font-weight:500;text-align:left;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.holo .need{margin:8px 0;padding:7px 9px;border-radius:9px;background:rgba(250,204,21,.14);border:1px solid rgba(250,204,21,.45);font-size:12.5px;text-align:left}
.holo .job{font-size:12.5px;margin:8px 0;text-align:left}
.holo .ctx{text-align:left}
.holo .actions{justify-content:center}
.pedestal{position:relative;width:310px;height:80px;margin-top:-10px;pointer-events:none;transform-style:preserve-3d}
.pedestal i{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%) rotateX(74deg);
  border:2px solid rgba(var(--c)/.7);box-shadow:0 0 24px rgba(var(--c)/.65),inset 0 0 24px rgba(var(--c)/.45)}
.pedestal i:nth-child(1){width:310px;height:310px;background:radial-gradient(rgba(10,16,30,.95) 55%,rgba(var(--c)/.25) 70%,transparent 72%)}
.pedestal i:nth-child(2){width:240px;height:240px;border-style:dashed;animation:spin3 14s linear infinite}
.pedestal i:nth-child(3){width:170px;height:170px;border-width:1px;animation:spin3 9s linear infinite reverse;border-style:dotted}
.pedestal i:nth-child(4){width:110px;height:110px;background:radial-gradient(rgba(var(--c)/.6),transparent 70%);animation:pulse3 2.6s ease-in-out infinite}
@keyframes spin3{to{transform:translate(-50%,-50%) rotateX(74deg) rotate(360deg)}}
@keyframes pulse3{50%{width:140px;height:140px;opacity:.6}}
.scene.dragging{cursor:grabbing}.scene.dragging .rig,.scene.dragging .shell{transition:none}
.tile,.stage:not(.empty){cursor:pointer}.holo{cursor:default;user-select:text}.holo button,.holo .bigav{cursor:pointer;user-select:none}
.rhint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:11px;color:#56668a;pointer-events:none;z-index:3}
.nobody{position:absolute;left:0;right:0;top:45%;text-align:center;color:#5b6b86;z-index:2}
@media (prefers-reduced-motion:reduce){.tile,.holo,.pedestal i,.parts i,.beam,.floor,.bigav:after,.stage.empty .hint{animation:none!important}.rig,.shell{transform:none!important}}
@media (max-width:820px){
  #room{padding:8px 0 14px}
  .scene{perspective:none;--tile:104px}
  .shell,.beam,.parts,.rhint{display:none}
  .scene{cursor:auto}
  .rig{grid-template-columns:minmax(0,1fr);transform:none!important;padding:14px 8px 24px;min-height:0}
  .center,.stage{min-width:0;max-width:100%}.holo .actions{flex-wrap:wrap}
  .pedestal{transform:scale(.8)}
  .wall,.holo{-webkit-box-reflect:unset}
  .wall.left,.wall.right{transform:none;direction:ltr;max-height:none;justify-content:center}
  .center{order:-1;min-height:0;transform:none}.stage.empty{height:auto;padding:16px}
}
</style>
</head>
<body>
<header>
  <div class="brand"><svg class="logo" viewBox="0 0 40 40" role="img" aria-label="hivey"><rect width="40" height="40" rx="9" fill="#9befc8"/><path d="M10 9h7v9h6V9h7v23h-7V22h-6v10h-7z" fill="#122319"/></svg><div><h1>hivey fleet</h1><div class="sub" id="sub">loading…</div></div></div>
  <div class="pills" id="pills"></div>
  <div class="spacer"></div>
  <input class="search" id="q" placeholder="Search agents, jobs…  ( / )" autocomplete="off">
  <div class="seg" id="views">
    <button data-v="room" title="3D command room: agents on the walls, the one you pick in the middle (1)">🛸 Room</button>
    <button data-v="board" title="Cards by what needs you (2)">▦ Board</button>
    <button data-v="list" title="One row per agent, for hundreds (3)">☰ List</button>
    <button data-v="jobs" title="Agent jobs: scheduled and background jobs, their map, spend, logs and sessions (4)">📊 Jobs</button>
    <button data-v="dash" title="Dashboards your agents keep: one place to open them all (5)">🖥 Dashboards</button>
  </div>
  <button class="iconbtn" id="music" title="Background music on/off (m)">🔇</button>
  <button class="iconbtn" id="refresh" title="Read every terminal and session log again now (r)">⟳</button>
  <button class="iconbtn" id="gear" title="Settings: music, updates, background">⚙</button>
</header>
<div id="settings" class="settings" hidden>
  <div class="t">⚙ Settings</div>
  <label><span>🎵 Music</span>
      <select class="every" id="track" title="Music: a new track each time, or always one">
        <option value="random">new each time</option>
        <option value="1">cosmic ambient</option>
        <option value="2">cosmic ambient II</option>
        <option value="3">dark techno</option>
        <option value="4">synthwave cruise</option>
        <option value="5">glitch downtempo</option>
        <option value="6">cinematic drones</option>
        <option value="7">lo-fi stars</option>
        <option value="8">berlin sequencer</option>
        <option value="9">deep house orbit</option>
        <option value="10">liquid drum &amp; bass</option>
      </select>
  </label>
  <label><span>⏱ Updates</span>
      <select class="every" id="every" title="How the fleet updates itself">
        <option value="minute">every minute</option>
        <option value="5min">every 5 min</option>
        <option value="15min">every 15 min</option>
        <option value="1h">every hour</option>
        <option value="reload">on reload only</option>
      </select>
  </label>
  <label><span>🌌 Background</span>
      <select class="every" id="space" title="Background: a new space scene every time, or always one">
        <option value="random">new each time</option>
        <option value="1">violet</option>
        <option value="2">emerald</option>
        <option value="3">crimson</option>
        <option value="4">deep blue</option>
        <option value="5">golden suns</option>
        <option value="6">singularity</option>
      </select>
  </label>
  <div class="note">Saved for every browser. 🔇 in the header mutes the music; ⟳ updates now.</div>
</div>
<main>
  <section id="fleet">
    <div id="labels"></div>
    <div id="hud"><button id="fit" title="Show everyone (f)">⤢ fit</button><button id="style" title="Comic or realistic look (t)">🎨 comic</button><span>drag to move · scroll to zoom · click an agent to open it in hivey · right-click for details</span></div>
  </section>
  <section id="room"></section>
  <section id="board"></section>
  <section id="list"></section>
  <section id="dash"></section>
  <section id="jobs"><div id="jobhealth"></div><iframe id="jobsframe" title="Agent jobs"></iframe></section>
</main>
<aside id="drawer"></aside>
<div id="tip"></div>
<div id="toast"></div>
<audio id="bgm" preload="auto"></audio>
<script type="module" src="./fleet.js"></script>
</body>
</html>
