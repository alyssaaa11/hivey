<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hivey office</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐝</text></svg>">
<style>
:root{
  --bg:#0d1119;--panel:#151b27;--panel2:#1b2332;--line:#273246;--text:#e8edf5;--muted:#8d9ab0;
  --honey:#f5b83d;--work:#38bdf8;--block:#fb7185;--done:#4ade80;--idle:#94a3b8;
  --r:14px;--font:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 var(--font)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--honey)}
/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;
  padding:10px 18px;background:rgba(13,17,25,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:6px}
.brand .logo{font-size:26px;filter:drop-shadow(0 0 8px rgba(245,184,61,.45))}
.brand h1{margin:0;font-size:17px;letter-spacing:.2px}
.brand .sub{color:var(--muted);font-size:12px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);font-size:13px;user-select:none;transition:.15s}
.pill b{font-variant-numeric:tabular-nums}
.pill:hover{border-color:#3b4a64}
.pill.on{background:var(--panel2);border-color:var(--honey);box-shadow:0 0 0 1px var(--honey) inset}
.pill.blocked b{color:var(--block)}.pill.working b{color:var(--work)}.pill.done b{color:var(--done)}.pill.idle b{color:var(--idle)}
.pill.compact b,.pill.clear b{color:var(--honey)}
.spacer{flex:1}
.search{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 11px;color:var(--text);width:210px;outline:none}
.search:focus{border-color:var(--honey)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--panel);border:0;padding:7px 12px;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 -2px 0 var(--honey)}
.iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 11px}
.iconbtn:hover{border-color:var(--honey)}
.every{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 9px;color:inherit;font:inherit;cursor:pointer}
.every:hover{border-color:var(--honey)}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- needs-you inbox ---------- */
#inbox{display:flex;gap:10px;overflow-x:auto;padding:10px 18px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(251,113,133,.08),transparent 60%)}
#inbox:empty{display:none}
#inbox .lead{flex:none;align-self:center;font-weight:600;color:var(--block);padding-right:4px;white-space:nowrap}
.ask{flex:none;display:flex;gap:10px;align-items:center;max-width:430px;padding:8px 10px;border-radius:12px;
  background:var(--panel);border:1px solid rgba(251,113,133,.45);cursor:pointer}
.ask:hover{background:var(--panel2)}
.ask.soft{border-color:rgba(245,184,61,.35)}
.ask .em{font-size:20px}
.ask .t{font-size:12.5px;color:var(--muted)}
.ask .t b{color:var(--text);display:block;font-size:13px}
.ask .go{margin-left:auto;font-size:12px;color:var(--honey);white-space:nowrap}
/* ---------- views ---------- */
main{position:relative}
#office{position:relative;height:calc(100vh - 118px);min-height:420px;overflow:hidden;
  background:radial-gradient(1200px 600px at 50% 20%,#18202e,#0b0e15)}
#office canvas{display:block;cursor:grab}
#office canvas.drag{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:4px;will-change:transform}
.bubble{max-width:230px;padding:7px 10px;border-radius:12px;background:#f8fafc;color:#0f172a;font-size:12px;line-height:1.3;
  box-shadow:0 6px 18px rgba(0,0,0,.35);position:relative;text-align:left}
.bubble:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#f8fafc}
.tag.blocked .bubble{background:#fff1f2;outline:2px solid var(--block)}
.tag.blocked .bubble:after{border-top-color:#fff1f2}
.tag.working .bubble{outline:2px solid rgba(56,189,248,.7)}
.plate{display:flex;align-items:center;gap:6px;padding:2px 8px;border-radius:8px;background:rgba(15,20,30,.82);
  border:1px solid var(--line);font-size:11.5px;white-space:nowrap}
.plate .dot{width:8px;height:8px;border-radius:50%}
.lod-tiny .plate{font-size:10px;padding:1px 6px}
.tag.sel .plate{border-color:var(--honey);box-shadow:0 0 0 1px var(--honey)}
.room-label{position:absolute;transform:translate(0,-50%);font-weight:700;font-size:13px;color:#cbd5e1;
  text-shadow:0 1px 6px #000;white-space:nowrap;letter-spacing:.2px}
.lod-tiny .room-label{font-size:11px}
.ship-label{position:absolute;left:0;top:0;border-radius:8px;border:1px solid transparent;pointer-events:auto;transition:background .15s,border-color .15s}
.ship-label .cap{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;white-space:nowrap;font-size:11px;color:#cfe0ff;
  background:rgba(10,16,32,.8);border:1px solid rgba(120,170,255,.35);border-radius:999px;padding:2px 9px;opacity:0;transition:opacity .15s;pointer-events:none}
.ship-label:hover,.ship-label.dragging{background:rgba(255,200,80,.10);border-color:rgba(255,200,80,.55)}
.ship-label:hover .cap,.ship-label.dragging .cap{opacity:1}
.ship-menu{position:fixed;z-index:60;min-width:210px;background:rgba(12,18,34,.96);border:1px solid rgba(120,170,255,.45);border-radius:12px;padding:8px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:6px}
.ship-menu .t{font-weight:700;padding:2px 4px 4px;text-transform:uppercase;letter-spacing:.05em;font-size:12px;color:#cfe0ff}
.ship-menu button{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:inherit;cursor:pointer}
.ship-menu button:hover{border-color:var(--honey)}
.ship-menu button.danger{color:#fda4af}.ship-menu button.danger.arm{background:#7f1d1d;color:#fff;border-color:#fb7185}
.ship-menu .note{font-size:11px;color:#93a4c3;padding:0 4px}
.ship-label{cursor:grab;touch-action:none;user-select:none}.ship-label.dragging{cursor:grabbing;border-color:var(--honey)}
#hud{position:absolute;left:14px;bottom:12px;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}
#hud button{background:rgba(21,27,39,.9);border:1px solid var(--line);border-radius:9px;padding:5px 9px}
#tip{position:fixed;z-index:30;pointer-events:none;max-width:340px;padding:11px 13px;border-radius:12px;background:rgba(21,27,39,.97);
  border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.45);display:none;font-size:12.5px}
#tip h4{margin:0 0 4px;font-size:14px}
#tip .hint{margin-top:7px;color:var(--muted);font-size:11.5px}
/* ---------- board ---------- */
#board{padding:16px 18px 40px;display:none}
.section{margin:6px 0 18px}
.section h2{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{position:relative;padding:13px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);
  cursor:pointer;transition:transform .12s,border-color .12s;content-visibility:auto;contain-intrinsic-size:260px}
.card:hover{transform:translateY(-2px);border-color:#3b4a64}
.card.blocked{border-color:rgba(251,113,133,.55);box-shadow:0 0 0 1px rgba(251,113,133,.25)}
.card.working{border-color:rgba(56,189,248,.4)}
.card .top{display:flex;gap:10px;align-items:center}
.avatar{position:relative;flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:23px;
  background:radial-gradient(circle at 35% 30%,var(--hue1),var(--hue2))}
.avatar .st{position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;border:2px solid var(--panel)}
.card.working .avatar{animation:bob .9s ease-in-out infinite}
.card.working .avatar:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--work);
  border-right-color:transparent;border-bottom-color:transparent;animation:spin 1.1s linear infinite}
.card.blocked .avatar{animation:wave 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-12deg)}85%{transform:rotate(10deg)}}
.name{font-weight:650;font-size:14.5px}
.meta{color:var(--muted);font-size:11.5px}
.card .say{margin:11px 0 8px;padding:8px 10px;border-radius:11px;background:var(--panel2);font-size:13px}
.card .job{font-size:12.5px;margin:6px 0}
.card ul{margin:4px 0 6px;padding:0;list-style:none;font-size:12px;color:#c7d0de}
.card li:before{content:"✓ ";color:var(--done)}
.card .next{font-size:12px;color:var(--muted)}
.card .need{font-size:12.5px;margin:7px 0;padding:7px 9px;border-radius:9px;background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.35)}
.ctx{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:11.5px;color:var(--muted)}
.ctx .bar{flex:1;height:6px;border-radius:9px;background:#0e131c;overflow:hidden}
.ctx .bar i{display:block;height:100%;border-radius:9px}
.badge{display:inline-flex;gap:4px;align-items:center;padding:1px 7px;border-radius:999px;font-size:11px;border:1px solid var(--line)}
.badge.compact,.badge.clear{border-color:rgba(245,184,61,.55);color:var(--honey)}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.actions button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12px}
.actions button:hover{border-color:var(--honey)}
.actions button.arm{border-color:var(--block);color:var(--block)}
.actions button.primary{border-color:rgba(245,184,61,.6)}
.actions button:disabled{opacity:.35;cursor:not-allowed}
/* ---------- list ---------- */
#list{display:none;padding:12px 18px 40px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--muted);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;position:sticky;top:57px;background:var(--bg)}
td{padding:6px 8px;border-bottom:1px solid #1a2130;vertical-align:top}
tr:hover td{background:var(--panel)}
tr{cursor:pointer}
td.j{max-width:420px}
/* ---------- drawer ---------- */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);z-index:40;background:var(--panel);border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .22s ease;overflow-y:auto;padding:18px 20px 30px;box-shadow:-20px 0 40px rgba(0,0,0,.4)}
#drawer.open{transform:none}
#drawer .x{position:absolute;top:12px;right:14px;background:none;border:0;font-size:20px;color:var(--muted)}
#drawer h3{margin:0;font-size:19px}
#drawer dl{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:12.5px;margin:14px 0}
#drawer dt{color:var(--muted)}
#drawer dd{margin:0;word-break:break-word}
#drawer pre{background:#0a0e15;border:1px solid var(--line);border-radius:10px;padding:10px;font:11px/1.35 ui-monospace,Menlo,monospace;
  white-space:pre-wrap;max-height:340px;overflow:auto;color:#c9d4e3}
.gauge{display:flex;align-items:center;gap:14px;margin:12px 0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);opacity:0;transition:.2s;z-index:50;
  padding:9px 15px;border-radius:11px;background:#111827;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%)}
.empty{padding:60px;text-align:center;color:var(--muted)}
.err{color:var(--block);font-size:12px}
.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%,30%,60%{box-shadow:0 0 0 2px #ffd36a,0 0 28px 6px rgba(127,232,255,.75);background-color:rgba(127,232,255,.12)}15%,45%,75%{box-shadow:0 0 0 1px #7fe8ff,0 0 10px 2px rgba(255,211,106,.4)}100%{box-shadow:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">🐝</span><div><h1>hivey office</h1><div class="sub" id="sub">loading…</div></div></div>
  <div class="pills" id="pills"></div>
  <div class="spacer"></div>
  <input class="search" id="q" placeholder="Search agents, jobs…  ( / )" autocomplete="off">
  <div class="seg" id="views">
    <button data-v="office" title="Your spaceships, one per hivey session (1)">🚀 Fleet</button>
    <button data-v="board" title="Cards by what needs you (2)">▦ Board</button>
    <button data-v="list" title="One row per agent, for hundreds (3)">☰ List</button>
  </div>
  <button class="iconbtn" id="music" title="Background music on/off (m)">🔇</button>
  <select class="every" id="every" title="How the office updates itself">
    <option value="minute">⏱ every minute</option>
    <option value="5min">⏱ every 5 min</option>
    <option value="15min">⏱ every 15 min</option>
    <option value="1h">⏱ every hour</option>
    <option value="reload">⏱ on reload only</option>
  </select>
  <select class="every" id="space" title="Background: a new space scene every time, or always one">
    <option value="random">🌌 new each time</option>
    <option value="1">🌌 violet</option>
    <option value="2">🌌 emerald</option>
    <option value="3">🌌 crimson</option>
    <option value="4">🌌 deep blue</option>
    <option value="5">🌌 golden suns</option>
    <option value="6">🌌 singularity</option>
  </select>
  <button class="iconbtn" id="refresh" title="Read every terminal and session log again now (r)">⟳</button>
</header>
<div id="inbox"></div>
<main>
  <section id="office">
    <div id="labels"></div>
    <div id="hud"><button id="fit" title="Show everyone (f)">⤢ fit</button><button id="style" title="Comic or realistic look (t)">🎨 comic</button><span>drag to move · scroll to zoom · click an agent to open it in hivey · right-click for details</span></div>
  </section>
  <section id="board"></section>
  <section id="list"></section>
</main>
<aside id="drawer"></aside>
<div id="tip"></div>
<div id="toast"></div>
<audio id="bgm" src="./music/space.mp3" loop preload="none"></audio>
<script type="module" src="./office.js"></script>
</body>
</html>
