name: Publish npm

# hivey's npm release: builds the binary for every platform in npm/platforms.json (now only
# Apple Silicon), packs @hivey/cli and @hivey/cli-<os>-<cpu>, checks the
# packages install and run, then publishes them with trusted publishing (no token). A v* tag publishes. Running it by hand builds and tests
# only, unless "publish" is ticked; so does a branch push that changes the packaging.
# First release and trust setup: docs/hivey-npm.md.

on:
  push:
    tags:
      - "v*"
    # Any branch changing the packaging: build and test only (publishing needs a tag).
    # GitHub ignores these paths for tag pushes.
    branches:
      - "**"
    paths:
      - "npm/**"
      - "scripts/npm/**"
      - ".github/workflows/publish-npm.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: publish to npm (otherwise build and test only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  build:
    if: github.repository == 'alyssaaa11/hivey'
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon only (user, 2026-10-23). The other four platforms (linux-x64,
        # linux-arm64, darwin-x64, win32-x64) built fine; to bring them back, restore their
        # entries here and in npm/platforms.json from commit 7efa5455.
        include:
          - key: darwin-arm64
            target: aarch64-apple-darwin
            os: macos-latest
            runs_here: true  # built for this runner

    runs-on: ${{ matrix.os }}
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: 'true'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "error: tag $GITHUB_REF_NAME doesn't match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Set Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: npm-${{ matrix.target }}

      - name: Remove Zig caches
        shell: bash
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.key }}"
          cp "target/${{ matrix.target }}/release/hivey" "dist/${{ matrix.key }}/hivey"

      # The ConPTY runtime herdr ships beside the binary (conpty/, verified by hash at start).
      - name: Stage binary with ConPTY
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Join-Path $env:RUNNER_TEMP "Microsoft.Windows.Console.ConPTY.nupkg"
          $stage = Join-Path $env:RUNNER_TEMP "hivey-windows-x86_64"
          .\scripts\package_windows_conpty.ps1 `
            -HerdrExe target\${{ matrix.target }}\release\hivey.exe `
            -PackagePath $package `
            -StageDir $stage `
            -OutputPath (Join-Path $env:RUNNER_TEMP "hivey-windows-x86_64.zip")
          $out = "dist\${{ matrix.key }}"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item (Join-Path $stage "herdr.exe") (Join-Path $out "hivey.exe")
          Copy-Item -Recurse (Join-Path $stage "conpty") (Join-Path $out "conpty")

      - name: Check the binary runs
        if: matrix.runs_here
        shell: bash
        run: |
          exe="dist/${{ matrix.key }}/hivey"
          [ -f "$exe" ] || exe="$exe.exe"
          "$exe" --version

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bin-${{ matrix.key }}
          path: dist/${{ matrix.key }}
          if-no-files-found: error

  package:
    needs: build
    runs-on: macos-latest  # Apple Silicon, to test-install the darwin-arm64 package
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: bin-*
          path: binaries

      - name: Build npm packages
        run: |
          for dir in binaries/bin-*; do mv "$dir" "binaries/${dir#binaries/bin-}"; done
          node scripts/npm/build-packages.mjs --binaries binaries --out target/npm --pack
          ls -l target/npm/tarballs

      # Installs the packed @hivey/cli the way users will (the darwin-arm64 binary from the local
      # tarball), then runs hivey through the launcher.
      - name: Test install
        run: |
          cd target/npm/tarballs
          npm install -g ./hivey-cli-darwin-arm64-*.tgz ./hivey-cli-[0-9]*.tgz
          hivey --version
          hivey setup --help
          test -f "$(npm root -g)/@hivey/cli/repo/plugins/slack-relay/herdr-plugin.toml"

      - name: Upload npm packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-packages
          path: target/npm/tarballs
          if-no-files-found: error

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds

      - name: Download npm packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-packages
          path: tarballs

      - name: Publish
        run: scripts/npm/publish.sh tarballs
