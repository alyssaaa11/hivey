# hivey: Dependabot version updates are off (open-pull-requests-limit: 0); dependencies are
# updated by hand. Security updates and vulnerability alerts are off in the repo settings.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      # 0.30.1+ diffs halfwidth kana + voiced mark as two columns, so the server's
      # backend replay blanks the voiced mark. Lift once the render path handles it.
      - dependency-name: ratatui
        versions: [">0.30.0"]
    groups:
      cargo-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
