# hivey: Dependabot version updates are off (open-pull-requests-limit: 0); dependencies are
# updated by hand. Security updates and vulnerability alerts are off in the repo settings.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns:
          - "*"
