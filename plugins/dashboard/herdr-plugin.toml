id = "hivey.dashboard"
name = "Swarm dashboard"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "hivey swarm addon: live pane with agent states, token usage charts, tasks, budget and messages"
platforms = ["linux", "macos"]

# Opened by `hivey swarm launch --addon hivey.dashboard` (or `hivey swarm addon <swarm>
# hivey.dashboard`) in the swarm's space with HIVEY_SWARM_ROOT / HIVEY_SWARM_SLUG set.
[[panes]]
id = "dashboard"
title = "swarm dashboard"
placement = "split"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/dashboard.py\""]
