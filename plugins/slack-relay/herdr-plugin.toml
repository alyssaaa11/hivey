id = "hivey.slack-relay"
name = "Slack relay"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "hivey swarm addon: bridges a swarm's message bus and its Slack channel"
platforms = ["linux", "macos"]

# Opened by `hivey swarm launch --addon hivey.slack-relay` in the swarm's space, with
# HIVEY_SWARM_ROOT / HIVEY_SWARM_SLUG / HIVEY_SWARM_CHANNEL set. Runs with the swarm root
# as working directory, so the script is addressed through HERDR_PLUGIN_ROOT.
[[panes]]
id = "relay"
title = "slack relay"
placement = "split"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/relay.py\""]
