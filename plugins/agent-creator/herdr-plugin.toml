id = "hivey.agent-creator"
name = "Agent creator"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Solo agent setup provider (built in): a Claude designer runs the hivey-agent-creator skill, designs ONE agent with you (on Claude Code, Codex, Grok or agy), writes its brief and wiki, then launches it"
platforms = ["linux", "macos"]

# `hivey swarm new --agent "<task>"` (or `--provider hivey.agent-creator`), run from the folder
# the agent will live in, opens this pane with HIVEY_SETUP_TASK and HIVEY_SETUP_CWD set. The
# designer follows the hivey-agent-creator skill (shipped with hivey): asks the user, writes
# <folder>/CLAUDE.md, makes its wiki with hivey-create-wiki, then `hivey swarm launch <folder>
# --solo` starts the agent in its own space. This pane stays a designer: close it afterwards.
[[panes]]
id = "setup"
title = "agent setup"
placement = "tab"
command = ["sh", "-c", "exec claude --dangerously-skip-permissions --model opus \"/hivey-agent-creator Agent folder: ${HIVEY_SETUP_CWD}\nTask: ${HIVEY_SETUP_TASK}\""]
