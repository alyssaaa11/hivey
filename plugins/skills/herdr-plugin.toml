id = "hiver.skills"
name = "Skills"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Skills provider (built in): picks each new agent's skills from your skills library, finds missing ones on skills.sh, installs them in the agent's own folder"
platforms = ["linux", "macos"]

# A skills provider is any plugin with a `skills.md` next to its manifest: the instructions swarm
# and agent creators follow to give every agent the skills its task needs. They read the chosen
# one with `hiver skills guide` (choose it in settings → plugins or with
# `hiver skills providers --default ID`). This plugin has no panes.
